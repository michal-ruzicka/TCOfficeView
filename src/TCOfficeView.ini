; ---------------------------------------------------------------------------
; TCOfficeView – Sample Configuration
;
; Lookup order (the first file that exists is used in full — settings are
; NOT merged across files):
;
;   1. %APPDATA%\GHISLER\TCOfficeView.ini       (per-user override)
;   2. <plugin install dir>\TCOfficeView.ini    (system-wide; ships with the
;                                                plugin, this is that file)
;
; To override settings just for your user account, copy this file to
;   %APPDATA%\GHISLER\TCOfficeView.ini
; and edit your copy. The system-wide file will then be ignored entirely.
;
; All values support Windows environment variables (for example %TEMP%,
; %LocalAppData%, %UserProfile%, %APPDATA%). They are expanded when the
; value is read.
; ---------------------------------------------------------------------------

[Logging]

; Diagnostic logging is OFF by default so logs do not silently grow on disk.
; To turn it on, set LogPath to a writable file path. Any missing parent
; directories will be created on first write.
;
; Examples:
;   LogPath=%TEMP%\TCOfficeViewHost.log
;   LogPath=%LocalAppData%\TCOfficeView\host.log
;   LogPath=C:\Logs\TCOfficeView.log
;
; Leave the value empty (or comment the line out) to disable logging.
;
;LogPath=%APPDATA%\GHISLER\TCOfficeView.log

[FallbackUI]

; Font used in the fallback information panel that is shown in place of a
; preview when no working preview handler is available — typically when
; MS Office is not installed. The font is scaled to the actual monitor DPI
; on creation, so the on-screen size stays consistent on HiDPI displays.

; Font family. Leave empty (the default) to auto-pick the first installed
; font from this list:
;   Aptos Mono     (preferred — ships with Microsoft 365 / Office 2024)
;   Consolas       (ships with Windows Vista and later)
;   Cascadia Mono  (ships with newer Windows / Windows Terminal)
;   Lucida Console (ships with Windows 2000 and later)
;   Courier New    (guaranteed final fallback — present since Windows 3.x)
;
; To override the auto-selection, set the exact family name.
;
;FontFamily=Lucida Console

; Font size in points. Default: 12. Clamped to the range 6..72.
;
;FontSize=14

[Mode]

; Per-application render mode. Four values are accepted:
;
;   quick-switchable  (default) — Preview Handler as the default render
;                       engine, with a small "→ Full" button in the top-right
;                       corner of the preview so you can flip to Full for a
;                       single file without changing this setting.
;
;   quick             — Preview Handler only; mode-switch button hidden.
;                       Fast (~200-800 ms cold start, ~30-80 MB), low memory,
;                       but uses the simplified rendering pipeline:
;                         - Word: web-layout, no page breaks / headers /
;                           footers / page numbers
;                         - Excel: simplified grid
;                         - PowerPoint: static slides without transitions
;
;   full-switchable   — OLE Automation (real app) as the default, with a
;                       "→ Quick" button so you can drop back to the quick
;                       renderer on demand.
;
;   full              — OLE Automation only; mode-switch button hidden.
;                       Drives a real Word / Excel / PowerPoint instance and
;                       reparents its window into the Lister pane. Slower
;                       (~2-4 s cold start, ~100-300 MB per instance) but
;                       renders documents the way the application itself
;                       does — Word in Print Layout with full pagination.
;
; The "switchable" variants show a persistent overlay button in every Word /
; Excel / PowerPoint preview.  The switch is per-preview only: selecting
; another file (or re-opening the same one) always goes back to the
; configured default.
;
; Requires a full MS Office installation (not Office Viewer) for the
; application you switch to full. On any failure (Office missing, COM
; activation refused, document protected, …) the plugin silently falls
; back to quick mode so you always get *some* preview.
;
; Notes per application in full mode:
;   - Word: applies Print Layout view, fit-to-page-width zoom, hides rulers.
;           ReadOnly via Documents.Open(ReadOnly=True).
;   - Excel: default view; ReadOnly via Workbooks.Open(ReadOnly=True).
;           The preview is fully interactive (cell selection, sheet tabs,
;           ribbon, scrolling) while Total Commander is the active window.
;   - PowerPoint: ReadOnly via Presentations.Open(ReadOnly=msoTrue).
;           ZoomToFit is applied; the slide rescales as the Lister is resized.
;
; In full mode all three apps hover as a borderless overlay window directly
; over the Lister pane. The preview is live while Total Commander is the
; active window; switching to another application shows a frozen snapshot
; of the last preview state (still readable) until you switch back.
;
;Word=full-switchable
;Excel=full-switchable
;PowerPoint=full-switchable

; Dwell-time before starting an Office application load, in milliseconds.
; Default: 1000.
;
; Applies when the plugin determines that a Word, Excel or PowerPoint file
; may need the real Office application — either because the configured mode
; is `full` or `full-switchable`, OR because the mode is `quick-switchable`
; with auto-fallback enabled (the default). The latter covers files stored
; on SharePoint sites in non-primary Microsoft 365 tenants: those fail in
; quick mode in about 70 ms and silently retry in full mode, making them
; indistinguishable from a full-mode file as far as this delay is concerned.
;
; When you navigate to such a file, the plugin waits this long before
; launching Office. If you move to a different file within this window the
; timer resets, so rapid arrow-key browsing does not trigger a wave of
; expensive Office cold-starts — only the file you actually pause on loads.
;
; The delay never applies to the mode-switch button (→ Full / → Quick) —
; those always load immediately because the user explicitly requested them.
;
; Set to 0 to disable the delay entirely (immediate load, as in earlier
; versions). Range: 0..10000 ms (clamped).
;
;FullLoadDelayMs=750

[AutoFallback]

; Per-application auto-fallback from quick to full mode.
;
; When the preview handler refuses to render an Office file (typical
; cause: documents synced from a SharePoint site in a non-primary
; Microsoft 365 tenant — the sandboxed preview-handler process cannot
; authenticate cross-tenant), TCOfficeView can silently retry the
; preview by launching the real Office application instead.  The real
; application runs as your user and has access to your full
; credential set, so it usually succeeds where the preview handler
; fails.  You see a working preview a couple of seconds later instead
; of an error panel.
;
; This is an Office-side limitation, not a TCOfficeView one — files
; affected by it also refuse to preview in Windows Explorer's
; Alt+P / Preview Pane.
;
; Auto-fallback is only attempted when ALL of the following hold:
;   1) The file is a Word, Excel, or PowerPoint document.
;   2) The application's mode in [Mode] above is set to
;      `quick-switchable` (the default).  For the explicit `quick`
;      mode, no fallback happens — the user has opted out of
;      switching to full and the fallback panel is shown instead.
;      For the `full` and `full-switchable` modes, the question
;      does not arise — those start in full mode already.
;   3) The toggle below for that application is `true` (the default).
;   4) The file is NOT Mark-of-the-Web blocked (downloaded from the
;      internet, copied from a network share, or saved from an email
;      attachment).  MOTW is the most common reason a quick handler
;      refuses to render an Office file, and the typical fix is a
;      single click on the "Unblock this file" button on the fallback
;      panel.  Once unblocked the file usually renders fine in quick
;      mode, which is simpler and lighter than full — so we prefer
;      to surface that button rather than silently launch the real
;      Office application.  Cross-tenant SharePoint documents that
;      are ALSO MOTW resolve naturally: after the user clicks
;      Unblock the file reloads, quick still fails, and at that
;      second LOAD the MOTW guard no longer fires so auto-fallback
;      proceeds to full mode as usual.
;
; When the application is explicitly configured for `full` or
; `full-switchable`, the MOTW guard does not apply — the document
; flows directly into the real Office application, which displays
; its own Protected View (yellow "Enable Editing" banner, content
; visible in a read-only sandbox).  MOTW handling there is left
; entirely to Office.
;
; Accepted values: true / false (also yes / no, on / off, 1 / 0).
; Default: true for all three applications.
;
; Set to false to suppress the implicit mode switch for an
; application — the fallback panel (with the preview handler's
; HRESULT for diagnosis) is shown instead.  You can still click the
; "→ Full" overlay button to load the file in full mode explicitly.
;
;Word=false
;Excel=false
;PowerPoint=false

[PreviewHandlers]

; Per-extension preview-handler CLSID overrides.
;
; If you have several preview handlers installed for the same file
; type — for example, both Microsoft Edge and Adobe Acrobat Reader
; register a PDF preview handler — Windows uses whichever one was
; registered last system-wide.  This section lets you tell *this*
; plugin to use a specific handler instead, regardless of the system
; default.  Explorer's preview pane and other applications keep using
; whatever Windows picked; the override is scoped to TCOfficeView
; only.
;
; Format:
;   <extension>=<CLSID-in-braces>     (use this specific handler)
;   <extension>=                      (DENY — let TC use the next plugin)
;
; - <extension> is the file extension, with or without the leading
;   dot, case-insensitive.
; - <CLSID-in-braces> is the full GUID with curly braces, exactly as
;   you find it in the registry.
; - An empty value (just "<extension>=" with nothing after) tells
;   TCOfficeView to behave as if no preview handler existed for that
;   extension at all, so Total Commander routes the file to the next
;   configured Lister plugin or its built-in viewer.  Useful when
;   another plugin (a dedicated PDF previewer, for example) does a
;   better job for that file type and you want to keep TCOfficeView
;   for everything else.
;
; To find the CLSID of an installed preview handler, you have two
; options:
;
; 1) Turn on the discovery report below (ReportPath=…), open the
;    file it produces, and copy the line for the extension you want.
;    The report is regenerated every time the host process launches
;    and contains, for the current machine:
;      - every installed preview handler with its friendly name and CLSID;
;      - every file extension currently routed through some handler,
;        with the assignment preformatted as a commented-out INI line
;        ready to copy here.
;    Disabled by default to avoid spending time on the registry walk
;    on every Lister session; turn it on only while you are setting
;    up overrides.
;
; 2) Look in the registry under
;      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\PreviewHandlers
;    Each value's name is the CLSID and its data is the friendly name
;    ("Microsoft Edge PDF Preview Handler", "Adobe PDF Preview
;    Handler", …).
;
; Discovery report — opt-in.  Set ReportPath to a writable file path
; and the plugin will (re)generate that file each time a Lister
; session starts, listing every installed preview handler (with
; CLSIDs) and every extension assignment in effect.  Each entry in
; the per-extension section is preformatted as a commented-out
; ".ext={CLSID} ; Friendly name" line you can copy straight into the
; overrides above.  Missing parent directories are created on first
; write.  Leave the value empty (or comment out the line) to skip
; report generation entirely — the recommended setting once you
; have your overrides in place.
;
;ReportPath=%APPDATA%\GHISLER\TCOfficeView.available-handlers.txt

; Examples (CLSIDs below are illustrative — confirm the actual GUIDs
; under the registry key above on your machine before relying on them):
;
;   .pdf={3A84F9C2-6164-485C-A7D9-4B27F8AC009E}   ; Microsoft PDF Previewer
;   .pdf={DC6EFB56-9CFA-464D-8880-44885D7DC193}   ; Adobe PDF Preview Handler for Vista
;   .pdf=                                         ; DENY — let another plugin handle .pdf
;   .html=                                        ; DENY — let another plugin handle .html
;
; The override (or deny) is applied before the standard registry
; lookup, so it always wins over the system-wide registration when
; present.  A bad CLSID is logged and the standard lookup proceeds.
;
;.pdf={3A84F9C2-6164-485C-A7D9-4B27F8AC009E}      ; Microsoft PDF Previewer
;.html=                                           ; DENY — let another plugin handle .html
;.htm=                                            ; DENY — let another plugin handle .htm
